<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>希望 MOD 書籤執行器</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 {
      color: #f0f6fc;
      font-size: 1.25rem;
      margin-bottom: 24px;
    }
    .bookmark-btn {
      display: inline-block;
      background-color: #238636;
      color: #ffffff;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4);
      cursor: move;
    }
    .bookmark-btn:hover {
      background-color: #2ea043;
    }
    .copy-btn {
      background-color: #1f6beb;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background 0.2s;
    }
    .copy-btn:hover {
      background-color: #388bfd;
    }
    .instructions {
      background-color: #0d1117;
      border: 1px dashed #30363d;
      border-radius: 8px;
      padding: 20px;
      text-align: left;
    }
    .instructions h2 {
      font-size: 0.95rem;
      color: #58a6ff;
      margin-top: 0;
      margin-bottom: 12px;
    }
    .instructions ol {
      margin: 0;
      padding-left: 20px;
      font-size: 0.85rem;
      line-height: 1.6;
      color: #8b949e;
    }
    .divider {
      border-top: 1px solid #30363d;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚡ 希望 MOD 執行小工具</h1>
    
    <!-- 電腦端：拖曳按鈕 -->
   <a class="bookmark-btn" href="javascript:(function(){fetch('https://raw.githubusercontent.com/jack1988520-pixel/SEAL/refs/heads/main/SEAL?t='+Date.now()).then(r=>r.text()).then(c=>{var s=document.createElement('script');s.text=c;document.head.appendChild(s);console.log(%27%E2%9C%85%20%E5%B8%8C%E6%9C%9B%20MOD%20%E5%B7%B2%E5%95%AF%E5%8B%95%27);}).catch(e=>alert(%27%E2%9D%8C%20%E8%BC%89%E5%85%A5%E5%A4%B1%E6%95%97:%20%27+e));})();">
   🚀 啟動希望 MOD (拖我到書籤列)
   </a>

    <!-- 手機端：一鍵複製按鈕 -->
    <div>
      <button class="copy-btn" onclick="copyCode()">📋 手機端：複製外掛代碼</button>
    </div>

    <div class="instructions">
      <h2>📌 使用方式：</h2>
      <ol>
        <li><b>電腦版：</b>按住綠色按鈕，直接拖曳到瀏覽器<b>「書籤列」</b>放開。</li>
        <div class="divider"></div>
        <li><b>手機版：</b></li>
        <li>1. 先隨便將任意網頁<b>「加入書籤」</b>（可命名為：希望 MOD）。</li>
        <li>2. 點擊上面的<b>「複製外掛代碼」</b>按鈕。</li>
        <li>3. 前往書籤列表點擊<b>「編輯」</b>該書籤，把<b>網址（URL）替換成複製的代碼</b>並儲存。</li>
        <div class="divider"></div>
        <li>以後開啟遊戲網頁時，點擊該書籤即可自動載入最新程式碼！</li>
      </ol>
    </div>
  </div>

  <script>
    function copyCode() {
      // 這裡自動抓取 <a> 標籤裡面的 href 內容（即 javascript:...）
      const code = document.querySelector('.bookmark-btn').getAttribute('href');
      navigator.clipboard.writeText(code).then(() => {
        alert('✅ 程式碼已複製成功！\n請去編輯手機書籤，將網址貼換掉。');
      }).catch(err => {
        alert('❌ 複製失敗，請確認瀏覽器權限：' + err);
      });
    }
  </script>
</body>
</html>
