<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>希望 MOD 書籤執行器</title>
  <style>
    body { font-family: -apple-system, sans-serif; background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 32px; max-width: 500px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
    h1 { color: #f0f6fc; font-size: 1.25rem; margin-bottom: 24px; }
    .bookmark-btn { display: inline-block; background-color: #238636; color: #ffffff; padding: 14px 24px; font-size: 1rem; font-weight: bold; text-decoration: none; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4); cursor: move; }
    .copy-btn { background-color: #1f6beb; color: #ffffff; border: none; padding: 10px 18px; font-size: 0.9rem; font-weight: bold; border-radius: 6px; cursor: pointer; margin-bottom: 20px; }
    .instructions { background-color: #0d1117; border: 1px dashed #30363d; border-radius: 8px; padding: 20px; text-align: left; }
    .instructions h2 { font-size: 0.95rem; color: #58a6ff; margin-top: 0; margin-bottom: 12px; }
    .instructions ol { margin: 0; padding-left: 20px; font-size: 0.85rem; line-height: 1.6; color: #8b949e; }
    .divider { border-top: 1px solid #30363d; margin: 15px 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚡ 希望 MOD 執行小工具</h1>
    
    <!-- 極短極簡化超連結 -->
    <a class="bookmark-btn" href="javascript:import('https://jack1988520-pixel.github.io/SEAL/loader.js')">
      🚀 啟動希望 MOD (拖我到書籤列)
    </a>

    <div>
      <button class="copy-btn" onclick="copyCode()">📋 手機端：複製外掛代碼</button>
    </div>

    <div class="instructions">
      <h2>📌 手機 Chrome 使用 SOP：</h2>
      <ol>
        <li>先將任意網頁加入書籤，名稱取為：<b>希望 MOD</b>。</li>
        <li>點擊上方<b>「複製外掛代碼」</b>，去編輯該書籤把網址替換掉。</li>
        <div class="divider"></div>
        <li><b>【重點】啟動方式：</b></li>
        <li>進遊戲後，點擊頂部<b>「網址列」</b>，輸入 <b>希望</b>。</li>
        <li>點擊下方出現 <b>⭐希望 MOD</b> 的搜尋結果即可啟動！</li>
      </ol>
    </div>
  </div>

  <script>
    function copyCode() {
      const code = document.querySelector('.bookmark-btn').getAttribute('href');
      navigator.clipboard.writeText(code).then(() => {
        alert('✅ 極短代碼已複製！\n貼上時絕對不會再被 Chrome 吃掉了。');
      }).catch(err => {
        alert('❌ 複製失敗: ' + err);
      });
    }
  </script>
</body>
</html>
