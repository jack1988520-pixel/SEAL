<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAL 放置希望外掛安裝器</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: #151c2c;
            --btn-purple: #6366f1;
            --btn-purple-hover: #4f46e5;
            --btn-dark: #1e293b;
            --btn-dark-hover: #334155;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 380px;
            padding: 32px 24px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        .icon-box {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            margin: 0 auto 16px auto;
        }

        h1 { font-size: 22px; margin-bottom: 4px; }
        .subtitle { font-size: 14px; color: var(--text-sub); margin-bottom: 24px; }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
        }

        .btn-purple { background-color: var(--btn-purple); }
        .btn-purple:hover { background-color: var(--btn-purple-hover); }

        .btn-dark { background-color: var(--btn-dark); }
        .btn-dark:hover { background-color: var(--btn-dark-hover); }
    </style>
</head>
<body>

<div class="container">
    <div class="icon-box">S</div>
    <h1>SEAL</h1>
    <p class="subtitle">放置希望外掛安裝器</p>

    <div class="btn-group">
        <!-- 核心按鈕觸發區 -->
        <button onclick="installScript()" class="btn-purple">安裝 SEAL 外掛</button>
        <button onclick="enterGame()" class="btn-dark">直接進入遊戲</button>
    </div>
</div>

<script>
  // 請修改為你自己的 loader.js 或 GitHub 網址
  const GITHUB_LOADER_URL = "https://your-github-username.github.io/loader.js";
  
  // 請修改為遊戲目標網址或你的 Cloudflare Worker 代理網址
  const GAME_URL = "https://idle-seal.pp771007.workers.dev";

  // 1. 安裝按鈕：自動判斷裝置並處理
  function installScript() {
    const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
    if (isMobile) {
      // 手機端：生成 Bookmarklet 程式碼並複製至剪貼簿
      const bookmarklet = `javascript:(function(){var s=document.createElement('script');s.src='${GITHUB_LOADER_URL}?v=${Date.now()}';document.body.appendChild(s);})();`;
      
      navigator.clipboard.writeText(bookmarklet).then(() => {
        alert("【啟動碼已複製】\n1. 請將當前頁面加入手機瀏覽器「書籤」。\n2. 編輯該書籤，把網址替換為剛剛複製的內容。\n3. 進入遊戲頁後點擊該書籤即可啟動外掛！");
      }).catch(() => {
        alert("複製失敗，請手動複製書籤語法。");
      });
    } else {
      // 電腦端：觸發 .user.js 檔案下載/安裝
      window.location.href = "seal.user.js";
    }
  }

  // 2. 進入遊戲按鈕：跳轉至遊戲網址
  function enterGame() {
    window.location.href = GAME_URL;
  }
</script>

</body>
</html>
