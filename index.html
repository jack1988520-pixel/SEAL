<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta
    name="theme-color"
    content="#0b1020">

  <title>SEAL｜放置希望外掛安裝器</title>

  <style>
    :root {
      --bg: #070b16;
      --card: #101827;
      --card2: #141f32;
      --line: #26344f;
      --text: #f8fafc;
      --muted: #94a3b8;
      --blue: #4f8cff;
      --purple: #7c5cff;
      --green: #22c55e;
      --yellow: #f59e0b;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding:
        max(18px, env(safe-area-inset-top))
        16px
        max(24px, env(safe-area-inset-bottom));

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(79, 140, 255, 0.22),
          transparent 34%
        ),
        radial-gradient(
          circle at 100% 35%,
          rgba(124, 92, 255, 0.16),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    .page {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      padding: 24px 0 14px;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 16px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--purple)
        );

      box-shadow:
        0 18px 55px rgba(79, 140, 255, 0.3);

      font-size: 36px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .environment {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      margin-top: 16px;
      padding: 8px 13px;

      border-radius: 999px;

      background: rgba(79, 140, 255, 0.08);
      border: 1px solid rgba(79, 140, 255, 0.18);

      color: #c7d7ff;
      font-size: 13px;
    }

    .environment-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
    }

    .card {
      margin-top: 16px;
      padding: 18px;

      border-radius: 18px;

      background:
        linear-gradient(
          180deg,
          rgba(20, 31, 50, 0.98),
          rgba(16, 24, 39, 0.98)
        );

      border: 1px solid var(--line);

      box-shadow:
        0 18px 60px rgba(0, 0, 0, 0.25);
    }

    .game-name {
      font-size: 17px;
      font-weight: 800;
    }

    .game-url {
      margin-top: 6px;

      color: #64748b;
      font-size: 12px;
      line-height: 1.5;

      word-break: break-all;
    }

    .status {
      margin-top: 15px;
      padding: 13px 14px;

      border-radius: 12px;

      background: #0b1220;
      border: 1px solid var(--line);

      font-size: 13px;
      line-height: 1.6;
    }

    .status.ok {
      color: #86efac;
    }

    .status.warn {
      color: #fbbf24;
    }

    .status.info {
      color: #bfdbfe;
    }

    .steps {
      margin-top: 14px;
    }

    .step {
      display: flex;
      gap: 12px;

      padding: 14px 0;

      border-bottom:
        1px solid rgba(148, 163, 184, 0.08);
    }

    .step:last-child {
      border-bottom: 0;
    }

    .step-no {
      width: 30px;
      height: 30px;

      flex: 0 0 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 10px;

      background: rgba(79, 140, 255, 0.12);

      color: #a8c4ff;

      font-size: 13px;
      font-weight: 800;
    }

    .step-body {
      flex: 1;
    }

    .step-title {
      font-size: 14px;
      font-weight: 800;
    }

    .step-text {
      margin-top: 4px;

      color: var(--muted);

      font-size: 12px;
      line-height: 1.65;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;

      margin-top: 18px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 48px;

      padding: 13px 16px;

      border-radius: 13px;
      border: 0;

      font-size: 14px;
      font-weight: 800;

      text-decoration: none;

      cursor: pointer;

      transition:
        transform 0.12s ease,
        opacity 0.12s ease;
    }

    .button:active {
      transform: scale(0.985);
    }

    .primary {
      color: white;

      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--purple)
        );
    }

    .secondary {
      color: #e5e7eb;

      background: #1b263b;

      border: 1px solid #2a3a58;
    }

    .outline {
      color: #aab8ca;

      background: transparent;

      border: 1px solid #2a3a58;
    }

    .panel {
      margin-top: 14px;
      padding: 14px;

      border-radius: 12px;

      font-size: 12px;
      line-height: 1.7;
    }

    .panel.warning {
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.18);
      color: #fbbf24;
    }

    .panel.success {
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.18);
      color: #86efac;
    }

    .manual {
      margin-top: 14px;
    }

    .manual h2 {
      margin: 0;
      font-size: 14px;
    }

    .manual ol {
      margin: 10px 0 0;
      padding-left: 20px;

      color: var(--muted);

      font-size: 12px;
      line-height: 1.8;
    }

    .hidden {
      display: none !important;
    }

    .footer {
      padding: 20px 0;

      text-align: center;

      color: #475569;

      font-size: 11px;
      line-height: 1.6;
    }

    @media (min-width: 700px) {
      body {
        padding-top: 48px;
      }

      .card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

<div class="page">

    <div class="subtitle">

    <div class="environment">

    <div

    <div class="buttons">

      <button

    <div

    <div

  </section>


  <section

  </section>


  <div class="footer">
    SEAL Web Installer<br>
    外掛目標限定為指定遊戲網址
  </div>

</div>
